
[project]
name = "data-disaggregation"
version = "0.12.0"
description = ""
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Christian Winger" }]
requires-python = ">=3.10,<3.15"
dependencies = ["pandas>=2.0"]
keywords = []

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Documentation = "https://wingechr.github.io/data-disaggregation"
Source = "https://github.com/wingechr/data-disaggregation"


[build-system]
requires = ["setuptools", "wheel", "build"]
build-backend = "setuptools.build_meta"


[dependency-groups]
dev = [
    "bump-my-version>=1.4.1",
    "pre-commit>=4.2",
    "ruff>=0.15.21",
    "poethepoet>=0.38",
]
test = [
    "tox-uv>=1.33",      # for uv-venv-runner
    "pytest>=9.0",
    "tox>=4.47",
    "pytest-cov>=7.0.0",
]
docs = [
    "mdx-truly-sane-lists>=1.3",
    "mistune>=2.0",
    "mkdocs>=1.6,<2.0",          # 2.0 is incompatible with material
    "mkdocs-jupyter>=0.26.3",
    "mkdocs-material>=9.7.7",
    "mkdocstrings-python>=1.16",
    "pymdown-extensions>=10.16",
]


[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
exclude = ["tests*", "docs*"]


[tool.bumpversion]

current_version = "0.12.0"
commit = true
tag = true
message = "version: {current_version} → {new_version}"
pre_commit_hooks = ["uv lock", "git add uv.lock"]


[[tool.bumpversion.files]]
filename = "data_disaggregation/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'


[tool.tox]
envlist = ["py310", "py314"]

[tool.tox.env_run_base]
runner = "uv-venv-lock-runner" # use tox-uv
commands = [["pytest"]]

[tool.poe.tasks]
cov = "uv run pytest --cov=data_disaggregation --cov-report=term-missing --cov-report=html:htmlcov --cov-report=xml:coverage.xml"
test = "uv run tox"
docs = "uv run mkdocs build"
build = "uv build"
bump = "bump-my-version bump"
